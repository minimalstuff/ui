name: Build and Publish Storybook to GitHub Pages

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Resolve latest stable release tag
        id: stable_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: Checkout latest stable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.stable_release.outputs.tag }}
          path: stable

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies (stable)
        working-directory: stable
        run: pnpm install --frozen-lockfile

      - name: Build stable Storybook
        working-directory: stable
        env:
          STORYBOOK_CHANNEL: stable
        run: pnpm run build-storybook -o ../site

      - name: Install dependencies (next)
        run: pnpm install --frozen-lockfile

      - name: Build next Storybook
        env:
          STORYBOOK_CHANNEL: next
        run: pnpm run build-storybook -o site/next

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          token: ${{ github.token }}

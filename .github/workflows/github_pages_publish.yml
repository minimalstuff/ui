name: Build and Publish Storybook to GitHub Pages

on:
  push:
    branches:
      - 'main'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve latest stable release tag
        id: stable_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - name: Checkout latest stable release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.stable_release.outputs.tag }}
          path: stable

      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies (stable)
        working-directory: stable
        run: pnpm install --frozen-lockfile

      - name: Build stable Storybook
        working-directory: stable
        env:
          STORYBOOK_CHANNEL: stable
        run: pnpm run build-storybook -o ../site

      - name: Install dependencies (next)
        run: pnpm install --frozen-lockfile

      - name: Build next Storybook
        env:
          STORYBOOK_CHANNEL: next
        run: pnpm run build-storybook -o site/next

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          token: ${{ github.token }}

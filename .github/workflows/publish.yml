name: CI & Publish

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
      pre-release-id:
        description: Prerelease identifier (for example alpha), empty for a stable release
        type: string
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    uses: minimalstuff/tooling/.github/workflows/release.yml@v0.9.0
    with:
      increment: ${{ inputs.increment }}
      pre-release-id: ${{ inputs.pre-release-id }}
    secrets:
      release-deploy-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
    permissions:
      contents: write

  build:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      node-version: ${{ steps.metadata.outputs.node-version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Read package metadata
        id: metadata
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "node-version=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - name: Check packed version matches the release
        env:
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
          PACKED_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if [[ "$PACKED_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Packed version $PACKED_VERSION does not match released version $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Pack tarball
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          echo "tarball=$(ls "$RUNNER_TEMP/package")" >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Publish to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          TAG=$([[ "$VERSION" == *-* ]] && echo "next" || echo "latest")
          npm publish "$RUNNER_TEMP/package/$TARBALL" --tag "$TAG"

  storybook:
    needs: publish
    uses: ./.github/workflows/github_pages_publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
